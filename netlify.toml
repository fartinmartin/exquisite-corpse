[build]
  base = "packages/app"
  command = "pnpm build"
  publish = "build"
  # Runs from `base`. Exit 0 skips the build. Netlify's default only watches
  # `base`, which would miss changes to the workspace packages the app imports.
  ignore = "[ \"$CACHED_COMMIT_REF\" != \"$COMMIT_REF\" ] && git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ../firestore ../lexicons ../../package.json ../../pnpm-lock.yaml ../../pnpm-workspace.yaml ../../netlify.toml"

[build.environment]
  NODE_VERSION = "22"

# Server-side env (set in the Netlify UI, not committed):
#   FIREBASE_SERVICE_ACCOUNT (raw or base64 JSON), ECC_ADMIN_PASSWORD

# Static assets that aren't content-hashed. A day in browsers, longer at the CDN
# (a deploy purges the CDN cache, so edits still go out on deploy).
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
    Netlify-CDN-Cache-Control = "public, max-age=31536000"
