<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Per-page title, description and og:* tags come from lib/components/seo.svelte. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="exquisite corpse club" />
    <!-- Body text font: start fetching before the CSS is parsed to avoid a swap reflow. -->
    <link rel="preload" href="/fonts/spacemono/SpaceMono-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="icon" href="/icon.png" />
    <link rel="apple-touch-icon" href="/icon.png" />
    <!-- Never turned a drawing over: /fresh home holds its buttons back. Known
         before first paint, so they don't flash (see routes/fresh/ui). -->
    <script>
      try {
        if (!JSON.parse(localStorage.getItem("ecc-learned") || "[]").includes("turn"))
          document.documentElement.dataset.firstVisit = "";
      } catch {}
    </script>
    <script
      id="counterscale-script"
      data-site-id="exquisitecorpse.club"
      src="https://analytics.fartinmartin.workers.dev/tracker.js"
      defer
    ></script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div id="app">%sveltekit.body%</div>
  </body>
</html>
